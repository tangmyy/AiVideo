[project]
name = "aivideo"
version = "0.1.0"
description = "Bilibili and Douyin desktop downloader with audio transcription"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.11",
    "requests>=2.32.0",
    "bilibili-api-python==17.2.1",
    "python-dotenv==1.1.1",
    "qasync>=0.27.1",
    "aiohttp>=3.12.1",
    "faster-whisper>=1.2.1",
    "playwright>=1.65.2",
]
[tool.uv]
constraint-dependencies = ["pyqt5-qt5 <=5.15.2"]
